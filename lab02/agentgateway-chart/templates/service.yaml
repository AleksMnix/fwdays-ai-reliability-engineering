apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  labels:
    app: agentgateway
spec:
  type: {{ .Values.service.type }}
  selector:
    app: agentgateway
  ports:
  - name: api
    port: {{ .Values.service.apiPort }}
    targetPort: api
  - name: ui
    port: {{ .Values.service.uiPort }}
    targetPort: ui
